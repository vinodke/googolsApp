name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Googols.slnx
      - run: dotnet build Googols.slnx --no-restore -c Release
      - run: dotnet test Googols.slnx --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/googols-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/googols-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
